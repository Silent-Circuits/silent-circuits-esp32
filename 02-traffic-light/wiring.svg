<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 788 632" role="img" aria-labelledby="title desc">
<title id="title">ESP32 HW-394 traffic light wiring</title>
<desc id="desc">Top view with USB-C at the bottom. The right header begins D23, D22, TX0, RX0, D21. Each used GPIO connects through its own 220 to 330 ohm resistor to its LED anode. All cathodes connect to ground.</desc>
<rect width="788" height="632" rx="18" fill="#f5f8fc"/>
<g font-family="system-ui, sans-serif" fill="#172438">
<text x="36" y="51" font-size="27" font-weight="700">ESP32 Traffic Light Wiring</text>
<text x="37" y="81" font-size="15">HW-394 • Component side, USB-C down</text>
<rect x="57" y="111" width="257" height="467" rx="16" fill="#172438"/>
<rect x="131" y="128" width="112" height="37" rx="5" fill="#30445e"/>
<text x="187" y="151" text-anchor="middle" fill="#fff" font-size="13">Antenna</text>
<rect x="131" y="167" width="112" height="127" rx="5" fill="#d7e0ec"/>
<text x="187" y="223" text-anchor="middle" font-size="16" font-weight="700">ESP32</text>
<text x="187" y="249" text-anchor="middle" font-size="14">HW-394</text>
<rect x="153" y="553" width="67" height="44" rx="6" fill="#d7e0ec" stroke="#172438" stroke-width="2"/>
<text x="186" y="581" text-anchor="middle" font-size="13">USB-C</text>
