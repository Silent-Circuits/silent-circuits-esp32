<circle cx="78" cy="228" r="5"/><text x="91" y="233">D34</text><circle cx="292" cy="228" r="5"/><text x="278" y="233" text-anchor="end">RX0</text>
<circle cx="78" cy="257" r="5"/><text x="91" y="262">D35</text><circle cx="292" cy="257" r="5"/><text x="278" y="262" text-anchor="end">D21</text>
